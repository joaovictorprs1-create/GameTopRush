inv=3;pg=12;engine(1);music(1);siren(1);$('nt').style.display='block';$('over').style.display='none';st='run'});

['VEL','MAN','SLT','ÍMÃ','NIT'].map((k,j)=>'<div class="st"><span>'+k+'</span><i><u style="width:'+c.s[j]/8*100+'%"></u><u class="up" style="width:'+UP(i)[j]*INC[j]/8*100+'%"></u></i></div>').join('')+
'<button data-i="'+i+'"'+(!own&&S.coins<c.p?' disabled':'')+'>'+(own?(S.sel===i?'✔ Em uso':'Usar'):'🪙 '+c.p)+'</button></div>'}).join('')}

function mv(d){if(st==='run')P.lane=Math.max(0,Math.min(2,P.lane+d))}

addEventListener('keydown',e=>{if(e.key===' '||e.key==='ArrowUp')useNitro();if(e.key==='ArrowLeft'||e.key==='a')mv(-1);if(e.key==='ArrowRight'||e.key==='d')mv(1)});

function update(dt){const car=CARS[S.sel],run=st==='run';
const sm=.8+.08*ES[0];speed=run?(30+Math.min(dist/50,14)+Math.min(14,Math.max(0,dist-700)/130))*sm*(nitro>0?1.45:1):12;
if(eo)eo.frequency.setTargetAtTime(38+speed*1.8,AC.currentTime,.1);
if(run){dist+=speed*dt*.5;inv=Math.max(0,inv-dt);
 if(nitro>0){nitro=Math.max(0,nitro-dt);nm=nitro/3*100;burst(P.x+(rnd()-.5)*.8,.5,2,0xff9800,1,3)}
 if(nitro<=0)nm=Math.min(100,nm+dt*(.5+.5*ES[4]));pg-=(.35+Math.min(.5,dist/4000))*dt;if(nitro>0)pg+=5*dt;pg=Math.min(16,pg);
 if(pg<8&&!wn){wn=true;banner('🚓 Polícia chegando! Pegue moedas ou use o nitro!')}else if(pg>10)wn=false;
 if(pg<=4.6&&inv<=0){crash('🚓 PRESO!');return}
 const np=Math.floor(dist/500);if(np!==ph){if(ph>=0){rc+=25;banner('FASE '+(np+1)+': '+PH[np%PH.length].n+'  +25🪙')}else banner('FASE 1: '+PH[0].n);ph=np;setPh(np);snd(523,.4,'triangle',.1,1046);music(1)}
 spT-=speed*dt;if(spT<=0)row();
 P.x+=(LX[P.lane]-P.x)*Math.min(1,dt*(5+2.5*ES[1]));
 if(P.y>0||P.vy>0){P.vy-=24*dt;P.y+=P.vy*dt;if(P.y<=0){P.y=0;P.vy=0}}
 const mag=1.2+.4*(ES[3]-1);
 for(let i=objs.length-1;i>=0;i--){const o=objs[i],m=o.m;m.position.z+=(speed-o.v)*dt;if(o.v&&m.userData.w)m.userData.w.forEach(w=>w.rotation.x-=Math.abs(o.v)*dt/.4);
  if(o.t==='coin')m.rotation.y+=dt*4;
  const dx=Math.abs(m.position.x-P.x),z=m.position.z;
  if(o.t==='coin'){if(dx<mag&&Math.abs(z)<1.6&&Math.abs(P.y+.7-m.position.y)<1.6){rc++;pg=Math.min(16,pg+.25);nm=Math.min(100,nm+1.6+.8*ES[4]);snd(1000,.06,'sine',.02,1400);burst(m.position.x,m.position.y,z,0xffcc00,5,4);sc.remove(m);objs.splice(i,1);continue}}
  else if(o.t==='ramp'){if(!o.used&&dx<1.5&&z>-1&&z<3&&P.y<.1){P.vy=8+1.6*ES[2];o.used=1;S.mis.p[2]++;pg=Math.min(16,pg+1.5);snd(300,.35,'sine',.1,700);burst(P.x,.3,0,0xdddddd,8,5)}}
  else if(inv<=0&&dx<1.3&&Math.abs(z)<o.hl+1.6&&P.y<o.h-.1){if(nitro>0){burst(m.position.x,1,z,0xff9800,18,9);snd(120,.25,'sawtooth',.1,60);sc.remove(m);objs.splice(i,1);continue}crash();return}
  if(z>12){sc.remove(m);objs.splice(i,1)}}
}
for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.l-=dt;p.vy-=14*dt;p.m.position.x+=p.vx*dt;p.m.position.y=Math.max(0,p.m.position.y+p.vy*dt);p.m.position.z+=(p.vz+speed)*dt;p.m.scale.setScalar(Math.max(.01,p.l*1.4));if(p.l<=0){sc.remove(p.m);parts.splice(i,1)}}
player.position.set(P.x,P.y,0);
player.rotation.z=(P.x-LX[P.lane])*.12;
player.rotation.x=Math.max(-.5,Math.min(.5,P.vy*.03))+(P.y>0?0:Math.sin(performance.now()/85)*.008);player.rotation.y=st==='menu'?(menuA+=dt*.8):(P.x-LX[P.lane])*.1;
player.visible=!(inv>0&&Math.floor(inv*12)%2);
if(pol.visible){const fl=Math.floor(performance.now()/130)%2;px+=(P.x-px)*Math.min(1,dt*3.2);pol.position.set(px,0,pg);pol.rotation.y=(px-P.x)*.04;
rdM.color.setHex(fl?0xff2020:0x501010);blM.color.setHex(fl?0x102050:0x2c70ff);pol.userData.fl[0].visible=!!fl;pol.userData.fl[1].visible=!fl;
pol.userData.w.forEach(w=>w.rotation.x-=speed*dt/.4);
if(run){const n=Math.round(Math.max(0,Math.min(1,(pg-4.6)/7.4))*5);if(plE._n!==n){plE._n=n;plE.textContent='🚓 '+'▮'.repeat(n)+'▯'.repeat(5-n)}
srE.style.opacity=Math.max(0,Math.min(.6,(12-pg)/10))*(.5+.5*fl);srE.className=fl?'a':'b';if(so){const hi=Math.floor(performance.now()/450)%2;so.frequency.setTargetAtTime(hi?880:659.25,AC.currentTime,.04);sg.gain.setTargetAtTime(mute?0:Math.max(0,Math.min(1,(13-pg)/9))*.035,AC.currentTime,.1)}}else srE.style.opacity=0}
const u=player.userData;u.w.forEach(w=>w.rotation.x-=speed*dt/.4);u.sh.position.y=.05-P.y;u.sh.rotation.x=-Math.PI/2-player.rotation.x;
if(run){const nb=$('nt'),v=Math.floor(nm)+'|'+(nitro>0);if(nb._v!==v){nb._v=v;nb.style.background=nitro>0?'#ff5722':'linear-gradient(0deg,#ff9800 '+nm+'%,#2a2f55 '+nm+'%)';nb.textContent=nitro>0?'🔥':nm>=100?'🔥 NITRO!':'⚡'+Math.floor(nm)+'%'}}
if(st==='run'){acT-=dt;const A=AIR[cp];if(A&&acT<=0&&acs.length<2){const k=A.length>1?A[ri(2)]:A,d=rnd()<.5?-1:1,o=new THREE.Group(),g=k==='p'?mkPlane():mkHeli();o.add(g);
o.rotation.y=d<0?Math.PI:0;if(k==='h')g.rotation.z=-.1;o.position.set(-d*(k==='p'?95:60),k==='p'?20+rnd()*8:13+rnd()*7,k==='p'?-62-rnd()*14:-45-rnd()*25);
sc.add(o);acs.push({o,g,k,vx:d*(k==='p'?30:15),c:0});acT=7+rnd()*9}}
for(let i=acs.length-1;i>=0;i--){const f=acs[i],o=f.o;o.position.x+=f.vx*dt;o.position.z+=speed*dt*(f.k==='h'?.12:.03);
if(f.k==='p')wave(performance.now()/1000);if(f.k==='h'){f.g.userData.rot.rotation.y+=dt*32;if(Math.abs(o.position.x)<45&&(f.c-=dt)<=0){f.c=.17;snd(62,.07,'sine',.05)}}
f.g.userData.bl.visible=Math.floor(performance.now()/450)%2===0;if(Math.abs(o.position.x)>115){sc.remove(o);acs.splice(i,1)}}
const TT=performance.now()/1000;props.forEach(g=>{g.position.z+=speed*dt;if(g.position.z>12)placeProp(g,-175-rnd()*30);
if(g.userData.n)g.userData.n.forEach(p=>{const q=p.userData;q.a2.rotation.z=q.wv?2.5+Math.sin(TT*9+q.ph)*.35:.12;p.position.y=q.wv?Math.abs(Math.sin(TT*5+q.ph))*.08:0})});
lpM.opacity=nf*.55;lmG.opacity=.3+nf*.7;
sl.forEach(m=>{m.visible=nitro>0;if(m.visible){m.position.z+=speed*dt*1.4;if(m.position.z>8)m.position.set((rnd()-.5)*16,.4+rnd()*5,-70)}});
const W=TH[cp].w;wx.visible=!!W;if(W){const a=wxG.attributes.position.array,vy=W==='snow'?-3:W==='rain'?-22:4;
for(let i=0;i<WN;i++){const j=i*3;a[j+1]+=vy*dt;a[j+2]+=speed*dt;if(W==='snow')a[j]+=Math.sin(a[j+1]+i)*dt;
if(a[j+2]>8||a[j+1]<0||a[j+1]>22){a[j]=(rnd()-.5)*34;a[j+1]=W==='ember'?0:22;a[j+2]=-5-rnd()*65}}wxG.attributes.position.needsUpdate=true}
dashes.forEach(m=>{m.position.z+=speed*dt;if(m.position.z>10)m.position.z-=160});
scen.forEach(m=>{m.position.z+=speed*dt;if(m.position.z>12)placeS(m,-190-rnd()*8)});
const hd=Math.floor(dist)+' m';if($('hd').textContent!==hd){$('hd').textContent=hd;$('hp').textContent=ph>=0?'Fase '+(ph+1)+' • '+Math.round(speed*3.6)+' km/h':'';$('hc').textContent='🪙 '+(S.coins+rc)}
}
function frame(t){requestAnimationFrame(frame);const dt=Math.min(.05,(t-last)/1000||0);last=t;
update(dt);
for(const k in cc)cc[k].lerp(tc[k],Math.min(1,dt*1.5));
sc.fog.color.copy(cc.sky);roadM.color.copy(cc.road);scM.color.copy(cc.scen);gM.color.copy(cc.gnd);
bM.color.copy(cc.scen);mzM.color.copy(cc.scen);mtM.color.copy(cc.scen).multiplyScalar(.5);nf+=(TH[cp].n-nf)*Math.min(1,dt*1.5);bM.emissiveIntensity=nf*1.3;starM.opacity=nf;bmM.opacity=.55+nf*.45;

const mn=st==='menu',tf=nitro>0?82:65;if(Math.abs(cam.fov-tf)>.1){cam.fov+=(tf-cam.fov)*Math.min(1,dt*5);cam.updateProjectionMatrix()}

if(shake>0){shake-=dt;cam.position.x+=(rnd()-.5)*.6;cam.position.y+=(rnd()-.5)*.6}

R.render(sc,cam)}
menu();requestAnimationFrame(frame);
